[workspace]
members = ["yuzukan-engine", "yuzukan-cli", "yuzukan-im/core"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
repository = "https://github.com/otofu1024/yuzukan"
homepage = "https://github.com/otofu1024/yuzukan"

[workspace.dependencies]
# Shared across all 3 crates
serde = { version = "1", features = ["derive"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Shared across 2 crates
serde_json = "1"
toml = "1.0"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# Internal crates
yuzukan-engine = { path = "yuzukan-engine" }
yuzukan-im = { path = "yuzukan-im/core" }

# Dev dependencies shared
tempfile = "3"

[profile.release]
lto = "thin"
