<body>
<p>インストールが終わりました。初めて使うときは次の設定をしてください。</p>
<ol>
    <li>一度ログアウトして、ログインし直します。</li>
    <li>「システム設定」の「キーボード」を開き、「入力ソース」の「編集」を押します。</li>
    <li>「+」を押し、「日本語」の中の「yuzukan」を追加します。</li>
    <li>メニューバーの入力メニューから yuzukan を選びます。</li>
</ol>
<p>更新の場合は、これらの設定は不要です。</p>
</body>
