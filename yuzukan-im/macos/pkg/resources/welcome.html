<body>
<p>ローカル LLM でかな漢字変換する日本語入力システム yuzukan をインストールします。</p>
<p>辞書と変換モデルを含むため、インストール後はネットワーク接続なしで使えます。</p>
<ul>
    <li>対象: Apple Silicon の Mac、macOS 13 以降</li>
    <li>インストール先: /Library/Input Methods</li>
</ul>
<p>ソースから <code>make install</code> で導入したことがある場合は、先に <code>~/Library/Input Methods/yuzukan.app</code> を削除してください。</p>
</body>
